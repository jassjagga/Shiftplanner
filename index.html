<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#1463d6"><meta name="description" content="Upload schedule photos and download a department shift sheet as PDF or Excel.">
  <title>ShiftSheet</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%231463d6'/%3E%3Cpath d='M10 12h20M10 20h20M10 28h20M18 10v20' stroke='white' stroke-width='2.5'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main>
    <h1>ShiftSheet</h1>
    <section class="upload-box" id="uploadBox">
      <label id="dropzone" class="dropzone" tabindex="0" role="button" aria-label="Upload schedule photos">
        <input id="fileInput" type="file" accept="image/jpeg,image/png,image/webp" multiple hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4m-4 4 4-4 4 4M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"/></svg>
        <span>Upload photos</span>
      </label>
      <div id="photoStrip" class="photo-strip" hidden></div>
      <div id="progressPanel" class="progress-panel" hidden><div><span id="progressLabel">Reading photos…</span><button id="cancelScan" class="cancel-btn" aria-label="Cancel reading">×</button></div><div class="progress-track"><div id="progressBar"></div></div></div>
    </section>
    <p id="errorMessage" class="error-message" role="alert" hidden></p>
    <section class="preview-card">
      <h2>Sheet preview</h2>
      <div class="paper-stage" id="paperStage"><div id="paperWrap" class="paper-wrap"><div id="sheetPaper" class="sheet-paper"></div></div></div>
      <div class="downloads"><button id="pdfBtn" class="btn primary" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M4 17v4h16v-4"/></svg>Download PDF</button><button id="excelBtn" class="btn" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M4 17v4h16v-4"/></svg>Download Excel</button></div>
    </section>
  </main>
  <script src="./vendor/tesseract.min.js" defer></script><script src="./vendor/pdf-lib.min.js" defer></script><script src="./vendor/jszip.min.js" defer></script><script type="module" src="./app.js"></script>
</body>
</html>
